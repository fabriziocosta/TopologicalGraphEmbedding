[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "topological-graph-embedding"
version = "0.1.0"
description = "Smooth spline graph embeddings for noisy point clouds"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
]

[project.optional-dependencies]
notebooks = [
    "matplotlib>=3.7",
    "scikit-learn>=1.3",
    "umap-learn>=0.5.5",
    "ipywidgets>=8.0",
    "plotly>=5.18",
    "h5py>=3.8",
    "requests>=2.28",
    "ripser>=0.6",
]
dev = [
    "pytest>=8",
    "coverage>=7",
    "ruff>=0.6",
]

[tool.setuptools.packages.find]
include = ["topological_graph_embedding*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
